<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - E-Commerce</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

    <link rel="stylesheet" href="../CSS/API_nav.css">
    <link rel="stylesheet" href="../CSS/API_profile.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="../HTML/API_nav.html">
                E-Commerce
            </a>

            <div class="collapse navbar-collapse">
                <div class="d-flex align-items-center gap-3 w-25">
                    <a class="nav-link active fw-semibold" href="../HTML/API_nav.html">
                        Home
                    </a>
                    <a class="nav-link fw-semibold" href="../HTML/API_nav.html">
                        Products
                    </a>
                </div>

                <div class="d-flex justify-content-center w-50">
                    <form class="d-flex w-100" id="searchForm">
                        <input class="form-control rounded-pill me-2" type="search" placeholder="Search Products..." id="searchInput">
                        <button class="btn btn-primary rounded-pill px-4" type="submit">
                            Search
                        </button>
                    </form>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-4 w-25">
                    <a href="#" class="text-dark position-relative text-decoration-none">
                        <i class="fa-solid fa-cart-arrow-down fs-4"></i>
                        <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                        </span>
                    </a>

                    <a href="../HTML/API_profile.html" class="text-dark text-decoration-none">
                        <i class="fa-regular fa-address-book fs-4"></i>
                    </a>

                    <button class="btn btn-outline-danger rounded-pill" id="logoutBtn">
                        Log Out
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-5" id="profileContainer">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4 border-0 profile-info">
                    
                    <div class="text-center mb-4">
                        <img id="userImage" width="150" height="150" class="rounded-circle profile-image border border-3 border-primary" src="https://via.placeholder.com/150" alt="Profile Photo">
                    </div>

                    <h3 class="text-center mb-4">User Profile</h3>
                    
                    <p><strong>User ID :</strong> <span id="userId">Loading...</span></p>
                    <p><strong>User Name :</strong> <span id="userName">Loading...</span></p>
                    <p><strong>Email :</strong> <span id="userEmail">Loading...</span></p>
                    <p><strong>Mobile :</strong> <span id="userPhone">Loading...</span></p>
                    <p><strong>Address :</strong> <span id="userAddress">Loading...</span></p>
                    
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../JS/API_profile.js"></script>

</body>
</html>

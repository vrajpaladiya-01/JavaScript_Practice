<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/FoodOrderSysytem.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="glass-card p-5 w-100" style="max-width: 600px;">
            
            <div class="text-center mb-4">
                <h1 class="fw-bold text-dark">🍔 Food Order System</h1>
                <p class="text-muted">Demonstrating Asynchronous JavaScript Flow</p>
            </div>

            <div class="input-group mb-4 shadow-sm rounded-3">
                <input type="text" id="foodInput" class="form-control form-control-lg border-0" placeholder="E.g. Pizza, Burger, Pasta..." autocomplete="off">
            </div>

            <div class="d-flex gap-2 mb-4 justify-content-center flex-wrap">
                <button id="btnCallback" class="btn btn-primary btn-lg custom-btn shadow-sm">Order (Callbacks)</button>
                <button id="btnPromise" class="btn btn-success btn-lg custom-btn shadow-sm">Order (Promises)</button>
                <button id="btnReset" class="btn btn-outline-danger btn-lg shadow-sm">Clear</button>
            </div>

            <div id="outputSection" class="d-flex flex-column gap-3"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/FoodOrderSystem.js"></script>
</body>
</html>

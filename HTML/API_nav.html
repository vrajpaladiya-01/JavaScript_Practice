<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="../CSS/API_nav.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="#">E-Commerce</a>

            <div class="collapse navbar-collapse">
                <div class="d-flex align-items-center gap-3 w-25">
                    <a class="nav-link active fw-semibold" href="#">Home</a>
                    <a class="nav-link fw-semibold" href="#">Products</a>
                </div>

                <div class="d-flex justify-content-center w-50">
                    <form class="d-flex w-100" id="searchForm">
                        <input class="form-control rounded-pill me-2" type="search" placeholder="Search Products..." id="searchInput">
                        <button class="btn btn-primary rounded-pill px-4" type="submit">Search</button>
                    </form>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-4 w-25">
                    <a href="#" class="text-dark position-relative text-decoration-none">
                        <i class="fa-solid fa-cart-arrow-down fs-4"></i>
                        <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                    <a href="../HTML/API_profile.html" class="text-dark text-decoration-none">
                        <i class="fa-regular fa-address-book fs-4"></i>
                    </a>
                    <button class="btn btn-outline-danger rounded-pill" id="logoutBtn">Log Out</button>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h2 class="fw-bold m-0">Product List</h2>

            <div class="d-flex gap-3">
                <select class="form-select w-auto shadow-sm cursor-pointer" id="categorySelect">
                    <option value="all">All Categories</option>
                </select>

                <select class="form-select w-auto shadow-sm cursor-pointer" id="sortSelect">
                    <option value="default">Sort By: Default</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="title-asc">Name: A to Z</option>
                    <option value="title-desc">Name: Z to A</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="productContainer">
            </div>

        <div class="d-flex justify-content-center align-items-center gap-3 mt-5 pagination-space">
            <button class="btn btn-primary" id="prevBtn">
                <i class="fa-solid fa-angle-left"></i> Previous
            </button>
            <span id="pageNumber" class="fw-bold fs-5">Page 1</span>
            <button class="btn btn-primary" id="nextBtn">
                Next <i class="fa-solid fa-angle-right"></i>
            </button>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/API_nav.js"></script>
</body>
</html>

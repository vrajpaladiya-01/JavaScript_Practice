<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/UserDataDashboard.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 User Data Dashboard</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Sidebar / Main Menu -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold">
                        📌 Main Menu
                    </div>
                    <div class="card-body">
                        <button class="btn btn-outline-primary w-100 mb-2" id="btnFetch">1. Fetch Users</button>
                        <button class="btn btn-outline-secondary w-100 mb-2" id="btnView">2. View All Users</button>
                        
                        <div class="input-group mb-2">
                            <input type="text" id="inputSearch" class="form-control" placeholder="Search by name">
                            <button class="btn btn-info text-white" id="btnSearch">3. Search</button>
                        </div>

                        <div class="input-group mb-2">
                            <input type="number" id="inputId" class="form-control" placeholder="Find by ID">
                            <button class="btn btn-success" id="btnFindId">4. Find</button>
                        </div>

                        <button class="btn btn-outline-warning w-100 mb-2" id="btnUppercase">5. Show Uppercase Names</button>

                        <div class="input-group mb-2">
                            <input type="text" id="inputCity" class="form-control" placeholder="Filter by City">
                            <button class="btn btn-danger" id="btnFilterCity">6. Filter</button>
                        </div>

                        <button class="btn btn-outline-dark w-100 mb-2" id="btnTotal">7. Total Users</button>
                        <button class="btn btn-secondary w-100" id="btnClear">8. Clear Screen (Exit)</button>
                    </div>
                </div>
            </div>

            <!-- Output Display Area -->
            <div class="col-md-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white fw-bold">
                        🧾 Output Screen
                    </div>
                    <div class="card-body output-screen" id="outputScreen">
                        <p class="text-muted">Waiting for action... Please click 'Fetch Users' first.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script src="../JS/UserDataDashboard.js"></script>
</html>

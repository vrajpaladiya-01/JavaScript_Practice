<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce App Flow</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/e-com.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark sticky-top d-none" id="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🛍️ MyShop</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="userInfo"></span>
                <button class="btn btn-outline-light btn-sm me-2" id="btnCart">🛒 Cart (<span id="cartCount">0</span>)</button>
                <button class="btn btn-danger btn-sm" id="btnLogout">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <div class="container mt-5" id="loginSection">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>Login</h4>
                        <small>Use user: <b>emilys</b> | pass: <b>emilyspass</b></small>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" id="username" class="form-control" required value="emilys">
                            </div>
                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" id="password" class="form-control" required value="emilyspass">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btnLoginBtn">Login</button>
                            <div id="loginError" class="text-danger mt-2 text-center"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Section -->
    <div class="container mt-4 d-none" id="mainSection">
        <!-- Filters & Search -->
        <div class="row mb-4">
            <div class="col-md-4">
                <select id="categorySelect" class="form-select">
                    <option value="all">All Categories</option>
                </select>
            </div>
            <div class="col-md-8">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                    <button class="btn btn-primary" id="btnSearch">Search</button>
                </div>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="text-center d-none my-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Loading...</p>
        </div>

        <!-- Products Grid -->
        <div class="row g-4" id="productsContainer">
            <!-- Products will be injected here via JS -->
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-center mt-4 mb-5">
            <button class="btn btn-outline-primary me-2" id="btnPrev">Previous</button>
            <button class="btn btn-outline-primary" id="btnNext">Next</button>
        </div>
    </div>

    <!-- Scripts (Make sure order is correct) -->
    <script src="../JS/e-com.js"></script>
    <script src="../JS/e-cpm1.js"></script>
</body>
</html>

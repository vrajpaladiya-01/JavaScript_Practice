<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="cart.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="#">🛍️ My Cart</a>
            <a href="index.html" class="btn btn-dark rounded-pill px-4">
                <i class="fa-solid fa-arrow-left me-2"></i> Continue Shopping
            </a>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row g-4">
            
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0">Shopping Cart</h3>
                    <h6 class="text-muted mb-0"><span id="cartItemCount">0</span> Items</h6>
                </div>
                
                <div id="cartContainer">
                    </div>
            </div>

            <div class="col-lg-4">
                <div class="summary-box bg-white p-4 rounded-4 shadow-sm">
                    <h4 class="fw-bold mb-4">Order Summary</h4>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-bold" id="subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Shipping</span>
                        <span class="fw-bold" id="shippingFee">$0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4 mt-3">
                        <h5 class="fw-bold mb-0">Total</h5>
                        <h5 class="fw-bold text-success mb-0" id="total">$0.00</h5>
                    </div>
                    <button class="btn btn-dark w-100 py-3 rounded-pill fw-bold fs-5 shadow-sm checkout-btn">
                        Checkout
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>

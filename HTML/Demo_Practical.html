<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Practice - Login</title>
</head>

<body>
    <div id="ans" style="margin-bottom: 20px; font-weight: bold;"></div>

    <div id="loginPage">
        <h1>Login Page</h1>
        <div id="loginForm">
            <input type="text" id="userid" placeholder="Enter user id (e.g. emilys)"><br><br>
            <input type="password" id="pass" placeholder="Enter password"><br><br>
            <button type="button" onclick="handleLogin()" id="login">Login</button>
        </div>
    </div>

    <div id="detailedPage" style="display: none;">
        <h1>User Dashboard</h1>
        <div id="profileData"></div>
        <br>
        <button type="button" onclick="logout()">Logout</button>
    </div>

</body>
<script src="../JS/Demo_practical.js"></script>
</html>

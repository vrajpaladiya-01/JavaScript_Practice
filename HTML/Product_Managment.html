<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/Product_Mnagement.css">
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="text-center mb-4">📦 Product Management System</h1>

    <div id="messageBox" class="alert d-none" role="alert"></div>

    <div class="row g-4">
        <div class="col-md-4">
            
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">Add Product</div>
                <div class="card-body">
                    <input type="text" id="addName" class="form-control mb-2" placeholder="Product Name">
                    <input type="number" id="addPrice" class="form-control mb-2" placeholder="Price">
                    <input type="number" id="addQty" class="form-control mb-3" placeholder="Quantity">
                    <button class="btn btn-primary w-100" onclick="handleAddProduct()">Add Product</button>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-secondary text-white">Manage by ID</div>
                <div class="card-body">
                    <input type="number" id="targetId" class="form-control mb-2" placeholder="Product ID">
                    <input type="number" id="updatePrice" class="form-control mb-3" placeholder="New Price (for Update)">
                    
                    <div class="d-flex gap-2">
                        <button class="btn btn-info text-white w-100" onclick="handleFindProduct()">Find</button>
                        <button class="btn btn-warning text-dark w-100" onclick="handleUpdateProduct()">Update</button>
                        <button class="btn btn-danger w-100" onclick="handleDeleteProduct()">Delete</button>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">Search</div>
                <div class="card-body d-flex gap-2">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by name...">
                    <button class="btn btn-success" onclick="handleSearchProduct()">Search</button>
                </div>
            </div>

        </div>

        <div class="col-md-8">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <span>Inventory Dashboard</span>
                    <span id="totalValueBadge" class="badge bg-success fs-6">Total: $0</span>
                </div>
                <div class="card-body">
                    
                    <div class="mb-3 d-flex flex-wrap gap-2">
                        <button class="btn btn-outline-dark btn-sm" onclick="viewProducts()">View All</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="filterExpensiveProducts()">Expensive (> $1000)</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="getUppercaseNames()">Show Uppercase Names</button>
                        <button class="btn btn-outline-success btn-sm" onclick="getTotalInventoryValue()">Calculate Total Value</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JS/Product_Management.js"></script>
</body>
</html>
